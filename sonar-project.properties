sonar.projectKey=MohammadJavedluhar_VayuShield-AI
sonar.organization=mohammadjavedluhar
sonar.projectName=VayuShield AI
sonar.projectVersion=1.0.0

# Source and Test directories
sonar.sources=src,api
sonar.tests=src/test
sonar.test.inclusions=src/test/**/*.test.ts,src/test/**/*.test.tsx

# Coverage report path generated by Vitest
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=node_modules/**,dist/**,coverage/**,public/**,**/*.config.ts,**/*.test.ts,**/*.test.tsx,src/assets/**
sonar.coverage.exclusions=src/test/**,**/*.config.ts,src/main.tsx,src/vite-env.d.ts

# Source encoding
sonar.sourceEncoding=UTF-8
