sonar.projectKey=MohammadJavedluhar_VayuShield-AI
sonar.organization=mohammadjavedluhar
sonar.projectName=VayuShield AI
sonar.projectVersion=1.0.0

# Source and Test directories
sonar.sources=src,api
sonar.tests=src/test,tests
sonar.test.inclusions=src/test/**/*.test.ts,src/test/**/*.test.tsx,tests/**/*.test.ts,tests/**/*.ts

# Coverage report path generated by Vitest
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=src/test/**,tests/**,node_modules/**,dist/**,coverage/**,public/**,**/*.config.ts,src/assets/**
sonar.coverage.exclusions=src/test/**,tests/**,**/*.config.ts,src/main.tsx,src/vite-env.d.ts,src/domain/types.ts,src/domain/types/**,api/_lib/types.ts

# Copy-Paste Duplication (CPD) exclusions
sonar.cpd.exclusions=src/test/**,tests/**,**/test/**,**/tests/**,**/fallbacks/**,**/schemas/**,**/i18n/**,src/domain/community/preseededReports.ts,src/components/vision/samplePhotos.ts,src/components/whatif/PrintableFamilyPlan.tsx,src/domain/types.ts,src/domain/types/**,api/_lib/types.ts

# Source encoding
sonar.sourceEncoding=UTF-8
